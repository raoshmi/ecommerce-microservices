name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Run full Maven build and unit tests to ensure production readiness
    - name: Build and run all tests with Maven
      run: mvn clean install

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Eureka Server Docker Image
      run: docker build -t e-shop-eureka-server -f eureka-server/Dockerfile .

    - name: Build Config Server Docker Image
      run: docker build -t e-shop-config-server -f config-server/Dockerfile .

    - name: Build Gateway Docker Image
      run: docker build -t e-shop-gateway -f api-gateway/Dockerfile .

    - name: Build User Service Docker Image
      run: docker build -t e-shop-user-service -f user-service/Dockerfile .

    - name: Build Product Service Docker Image
      run: docker build -t e-shop-product-service -f product-service/Dockerfile .

    - name: Build Inventory Service Docker Image
      run: docker build -t e-shop-inventory-service -f inventory-service/Dockerfile .

    - name: Build Order Service Docker Image
      run: docker build -t e-shop-order-service -f order-service/Dockerfile .

    - name: Build Payment Service Docker Image
      run: docker build -t e-shop-payment-service -f payment-service/Dockerfile .

    - name: Build Notification Service Docker Image
      run: docker build -t e-shop-notification-service -f notification-service/Dockerfile .

  deploy-info:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Deployment Status
      run: |
        echo "✅ Build and tests successful!"
        echo "Microservices compile, test, and containerize correctly!"
